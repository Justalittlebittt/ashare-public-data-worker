name: Public A-share candidate snapshot
on:
  workflow_dispatch:
  schedule:
    # Weekdays 18:00 China Standard Time (10:00 UTC), after the A-share close.
    - cron: '0 10 * * 1-5'
  push:
    paths:
      - 'collect.py'
      - 'test_collect.py'
      - 'risk_diagnostic.py'
      - 'test_risk_diagnostic.py'
      - 'archive_snapshot.py'
      - 'register_forecast.py'
      - '.github/workflows/collect.yml'
permissions:
  contents: write
concurrency:
  group: ashare-candidate-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit tests
        run: python -m unittest discover -v
      - name: Fetch public candidate closes
        run: python collect.py --start 2025-01-01 --output candidate.csv --min-sessions 272
      - name: Deterministic chronological holdout diagnostic
        run: |
          python -m zipfile -c candidate_snapshot.zip candidate.csv candidate.csv.manifest.json
          python risk_diagnostic.py candidate_snapshot.zip --output candidate_risk_diagnostic.json
      - name: Register current forecast before future outcome exists
        run: python register_forecast.py
      - name: Archive immutable candidate snapshot into public repository
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python archive_snapshot.py --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git commit -m "Archive candidate data from run $RUN_ID attempt $RUN_ATTEMPT"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: candidate-a-share-index-closes
          path: |
            candidate.csv
            candidate.csv.manifest.json
            candidate_risk_diagnostic.json
            candidate_forecast_registration.json
          retention-days: 30

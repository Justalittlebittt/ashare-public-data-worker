name: Candidate forecast maturity audit
on:
  push:
    paths:
      - 'evaluate_maturity.py'
      - 'test_evaluate_maturity.py'
      - '.github/workflows/maturity-audit.yml'
      - 'snapshots/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Maturity evaluation regression tests
        run: python -m unittest -v test_evaluate_maturity
      - name: Evaluate only 20-session-matured unique forecast dates
        run: python evaluate_maturity.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-maturity-audit-${{ github.run_id }}
          path: candidate_maturity_evaluation.json
          retention-days: 30
